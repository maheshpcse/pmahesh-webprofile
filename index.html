<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0d" />
    <script>
      // Apply the saved/OS theme before first paint to avoid a flash. Mirrors src/hooks/useTheme.ts.
      (function () {
        try {
          var t = localStorage.getItem('mahesh.os.theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>Mahesh Pachapalam - Senior Full Stack Engineer</title>
    <meta
      name="description"
      content="Portfolio of Mahesh Pachapalam, Senior Full Stack Engineer (6+ years) building scalable Node.js services and Angular applications across fintech and cloud platforms."
    />
    <meta property="og:title" content="Mahesh Pachapalam - Senior Full Stack Engineer" />
    <meta
      property="og:description"
      content="Node.js, Angular, TypeScript, AWS. Fintech, microservices, and event-driven systems."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="font-family: system-ui; padding: 2rem; color: #e6e6e6; background: #0a0b0d">
        <h1>Mahesh Pachapalam</h1>
        <p>Senior Full Stack Engineer. This portfolio needs JavaScript. You can reach me at
          <a href="mailto:maheshmahi1599@gmail.com" style="color: #9cc9ff">maheshmahi1599@gmail.com</a>
          or on <a href="https://github.com/maheshpcse" style="color: #9cc9ff">GitHub</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
